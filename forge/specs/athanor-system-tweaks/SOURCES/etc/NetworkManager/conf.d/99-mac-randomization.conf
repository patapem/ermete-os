# Athanor OS: Randomizzazione MAC Address (NetworkManager)
# Posizione: /etc/NetworkManager/conf.d/99-mac-randomization.conf

[device]
# Randomizza il MAC address durante la scansione delle reti Wi-Fi (probe requests)
wifi.scan-rand-mac-address=yes

[connection]
# Randomizza il MAC address durante la connessione attiva (Wi-Fi ed Ethernet)
# 'random': genera un MAC completamente casuale ad ogni connessione (massimo anonimato)
# Nota: se si preferisce mantenere il MAC consistente per ciascuna rete SSID (utile per captive portal/DHCP reservation), impostare 'stable'
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=random
