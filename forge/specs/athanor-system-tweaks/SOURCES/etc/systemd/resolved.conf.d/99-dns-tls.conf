# Athanor OS: DNS-over-TLS (DoT) e Hardening Risoluzione Nomi (systemd-resolved)
# Posizione: /etc/systemd/resolved.conf.d/99-dns-tls.conf

[Resolve]
# Forzatura obbligatoria di DNS-over-TLS (DoT). Non fallback su DNS in chiaro.
DNSOverTLS=yes

# Resolver DNS primari ad alte prestazioni con verifica SNI Hostname (#hostname)
DNS=1.1.1.1#cloudflare-dns.com 9.9.9.9#dns.quad9.net 2606:4700:4700::1111#cloudflare-dns.com 2620:fe::fe#dns.quad9.net

# Resolver DNS di fallback sicuri DoT
FallbackDNS=1.0.0.1#cloudflare-dns.com 149.112.112.112#dns.quad9.net 2606:4700:4700::1001#cloudflare-dns.com 2620:fe::9#dns.quad9.net

# Validazione crittografica delle risposte DNS
DNSSEC=yes

# Hardening e privacy risoluzione locale
Cache=yes
MulticastDNS=resolve
LLMNR=no
