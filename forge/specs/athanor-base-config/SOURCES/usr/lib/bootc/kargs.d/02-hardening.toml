# Athanor OS Kernel Hardening Arguments (Zero Performance Impact)
kargs = [
    "slab_nomerge",
    "pti=on",
    "randomize_kstack_offset=on",
    "vsyscall=none",
    "debugfs=off",
    "oops=panic",
    "module.sig_enforce=1",
    "lockdown=integrity",
    "init_on_free=1"
]
match-architectures = ["x86_64", "aarch64"]
