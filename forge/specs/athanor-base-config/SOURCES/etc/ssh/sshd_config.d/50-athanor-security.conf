# Athanor OS: Hardening Sicurezza SSH
# Posizione: /etc/ssh/sshd_config.d/50-athanor-security.conf

# Disabilita il login diretto via SSH per l'utente root
PermitRootLogin no

# Disabilita l'autenticazione tramite password
PasswordAuthentication no
KbdInteractiveAuthentication no

# Forza l'uso esclusivo di chiavi pubbliche SSH
PubkeyAuthentication yes

# Hardening aggiuntivo consigliato
X11Forwarding no
MaxAuthTries 3
