[package]
name = "athanor-compositor"
version = "0.1.0"
edition = "2021"
description = "Athanor OS Native AI-Driven Wayland Compositor (Smithay DRM/KMS & AI-Tiling IPC Engine)"
authors = ["athanor-compositor-architect"]

[dependencies]
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
zbus = { workspace = true }
futures-util = "0.3"
nix = { workspace = true, features = ["fs", "process", "signal"] }
smithay = { workspace = true, features = [
    "backend_drm",
    "backend_udev",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session",
    "renderer_gl",
    "wayland_frontend"
] }
wayland-server = { workspace = true }
glam = { workspace = true }
drm = "0.15.0"
gbm = "0.18.0"

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"
