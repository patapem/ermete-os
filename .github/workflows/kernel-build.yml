name: Kernel Build

# Il kernel Athanor (forge/specs/azoth, docs/architecture/doc_kernel_build.md).
# build: sul runner self-hosted, `prep` (sorgenti, patch, gate del config) in pochi
# minuti o `build` (RPM) in un'ora. boot: su runner GitHub con KVM, la boot matrix
# (SeaBIOS e OVMF con Secure Boot, CPU Nehalem e host) con le asserzioni della spec.
# publish: su runner GitHub, pubblica gli RPM come quattro OCI (kernel, devel,
# debuginfo, e il kernel guest delle MicroVM come tag <nvr>-microvm del kernel)
# firmati con cosign keyless, con SBOM, provenance SLSA e attestazione dei pin;
# `:latest` si muove solo su main. kmod: i moduli NVIDIA contro il kernel-devel appena
# costruito (nvidia-build.yml, riusabile). gate: il check unico "Kernel gate" che la
# protezione del branch richiede alle PR, anche a quelle del bot di bump (fase K5):
# per questo il workflow parte su ogni PR, senza filtro di percorsi. Una PR costruisce
# e avvia ma non pubblica. nvidia: sui push, a valle della pubblicazione, avvia
# nvidia-kmod.yml (firma, boot con Secure Boot, pubblicazione dei moduli). inputs: se
# l'immagine con questo NVR porta gia' l'attestazione degli identici input di build,
# build e publish non partono, e boot matrix e kmod usano le immagini pubblicate.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "prep: sorgenti, patch e gate del config. build: anche gli RPM e la pubblicazione."
        type: choice
        options: [prep, build]
        default: build
  pull_request:
  push:
    branches: [main, iso-v0]
    paths:
      - forge/specs/azoth/**
      - .github/workflows/kernel-build.yml
      - .github/workflows/nvidia-build.yml

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STAGE: ${{ inputs.stage || 'build' }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/azoth

jobs:
  inputs:
    # Un kernel gia' costruito da questi identici input non si ricompila: l'immagine
    # `<nvr>` porta l'attestazione dei pin (build-inputs.py), verificata con cosign;
    # se il predicato coincide con quello di questo commit, il riuso e' provato.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      nvr: ${{ steps.key.outputs.nvr }}
      reuse: ${{ steps.key.outputs.reuse }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - id: key
        run: |
          set -euo pipefail
          # Lo stesso NVR che rpmbuild produce con `%buildid .azoth` (build.sh);
          # publish verifica che coincidano.
          nvr=$(bash forge/specs/azoth/nvr.sh)
          python3 forge/specs/azoth/build-inputs.py > inputs.json
          reuse=false
          if cosign verify-attestation --type custom \
               --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/" \
               --certificate-oidc-issuer https://token.actions.githubusercontent.com \
               "${IMAGE}:${nvr}" 2> /dev/null \
             | jq -cS '.payload | @base64d | fromjson | .predicate.Data | fromjson' \
             | grep -qxF "$(jq -cS . inputs.json)"; then
            reuse=true
          fi
          echo "kernel ${nvr}: $([[ $reuse == true ]] && echo "immagine pubblicata con gli stessi input, niente build" || echo "build necessaria")" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "nvr=${nvr}" >> "$GITHUB_OUTPUT"
          echo "reuse=${reuse}" >> "$GITHUB_OUTPUT"

  build:
    needs: inputs
    if: ${{ (inputs.stage || 'build') == 'prep' || needs.inputs.outputs.reuse != 'true' }}
    runs-on: self-hosted
    # Kernel completo con -O3 e kCFI: un'ora su 16 core.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build the kernel builder image
        # Podman rootless sul runner WSL non ha una sessione systemd: crun non puo'
        # creare lo scope del container di build ("sd-bus call: Access denied").
        # L'isolamento chroot di buildah e' quello che gli altri workflow gia' usano.
        env:
          BUILDAH_ISOLATION: chroot
        run: podman build -t localhost/azoth-builder forge/specs/azoth/builder

      - name: Run build.sh
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/azoth" out
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/forge" \
            -v "$HOME/.cache/azoth:/var/cache/azoth" \
            -w /forge localhost/azoth-builder \
            bash forge/specs/azoth/build.sh --stage "$STAGE" --out /forge/out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-${{ env.STAGE }}
          path: out/
          if-no-files-found: error

      - name: Artifact for the boot matrix
        # Al job boot servono solo vmlinuz (il kernel-core, 21 MB invece di 1.3 GB) e
        # il pacchetto del kernel guest.
        if: ${{ env.STAGE == 'build' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-boot
          path: |
            out/kernel/kernel-core-*.rpm
            out/microvm/*.rpm
          if-no-files-found: error

      - name: Artifact for the NVIDIA modules
        # Al job kmod serve solo il kernel-devel.
        if: ${{ env.STAGE == 'build' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-devel
          path: out/devel/kernel-devel-[0-9]*.rpm
          if-no-files-found: error

  boot:
    needs: [inputs, build]
    # Anche con build saltato per riuso: la matrice gira sempre.
    if: ${{ !cancelled() && (inputs.stage || 'build') == 'build' && needs.inputs.result == 'success' && (needs.build.result == 'success' || needs.inputs.outputs.reuse == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ needs.inputs.outputs.reuse != 'true' }}
        with:
          name: kernel-boot
          path: out

      - name: Kernel-core and the guest kernel from the published images
        if: ${{ needs.inputs.outputs.reuse == 'true' }}
        env:
          NVR: ${{ needs.inputs.outputs.nvr }}
        run: |
          set -euo pipefail
          mkdir -p out
          for tag in "${NVR}" "${NVR}-microvm"; do
            ctr=$(podman create "${IMAGE}:${tag}" /kernel)
            podman cp "${ctr}:/." out/ && podman rm "$ctr" > /dev/null
          done
          ls out

      - uses: ./.github/actions/kvm

      - name: Build the boot-matrix image
        env:
          BUILDAH_ISOLATION: chroot
        run: podman build -t localhost/azoth-boot forge/specs/azoth/boot

      - name: Run boot.sh
        # Quattro avvii: {SeaBIOS, OVMF+Secure Boot via shim} x {Nehalem, host}, ognuno
        # deve chiudere con `K3 RESULT ok` sulla seriale (asserzioni in boot/init).
        run: |
          set -euo pipefail
          mkdir -p boot-out
          podman run --rm --device /dev/kvm -v "$GITHUB_WORKSPACE:/forge" -w /forge localhost/azoth-boot bash forge/specs/azoth/boot.sh --rpms /forge/out --out /forge/boot-out

      - name: Run microvm/boot.sh
        # Il kernel guest (spec, sezione 9): il vmlinux del pacchetto avvia in Firecracker
        # con una rootfs di prova e chiude con `K6 RESULT ok` (asserzioni in microvm/init).
        run: |
          set -euo pipefail
          podman run --rm --device /dev/kvm -v "$GITHUB_WORKSPACE:/forge" -w /forge localhost/azoth-boot bash forge/specs/azoth/microvm/boot.sh --rpms /forge/out --out /forge/boot-out/microvm

      - name: Summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          for f in boot-out/summary.md boot-out/microvm/summary.md; do
            if [[ -f $f ]]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        # Anche se la matrice fallisce, ma solo se boot.sh ha scritto qualcosa.
        if: ${{ always() && hashFiles('boot-out/**') != '' }}
        with:
          name: kernel-boot-logs
          path: boot-out/
          if-no-files-found: error

  kmod:
    # I moduli NVIDIA (spec, sezione 7, gate 4) contro questo kernel: l'artefatto
    # kernel-devel appena costruito, o l'immagine pubblicata quando il kernel e' riusato.
    needs: [inputs, build]
    if: ${{ !cancelled() && (inputs.stage || 'build') == 'build' && needs.inputs.result == 'success' && (needs.build.result == 'success' || needs.inputs.outputs.reuse == 'true') }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/nvidia-build.yml
    with:
      devel-artifact: ${{ needs.inputs.outputs.reuse != 'true' && 'kernel-devel' || '' }}

  gate:
    # Il check unico richiesto dalla protezione del branch: verde solo se ogni gate e'
    # verde, o saltato perche' il kernel e' riusato (build). Un solo nome da aspettare
    # per l'auto-merge del bot di bump.
    name: Kernel gate
    needs: [inputs, build, boot, kmod]
    if: ${{ always() && (inputs.stage || 'build') == 'build' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
      REUSE: ${{ needs.inputs.outputs.reuse }}
    steps:
      - run: |
          set -euo pipefail
          jq -r 'to_entries[] | "- \(.key): \(.value.result)"' <<< "$RESULTS" | tee -a "$GITHUB_STEP_SUMMARY"
          result() { jq -r --arg job "$1" '.[$job].result' <<< "$RESULTS"; }
          [[ $(result inputs) == success && $(result boot) == success && $(result kmod) == success ]]
          [[ $(result build) == success || ( $(result build) == skipped && $REUSE == true ) ]]

  publish:
    needs: [inputs, build, boot]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (inputs.stage || 'build') == 'build' && needs.build.result == 'success' && needs.boot.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kernel-build
          path: out

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26

      - name: Publish the four OCI images
        id: publish
        # Un'immagine da scratch con i soli RPM per ciascun gruppo, digest in digests/;
        # il kernel guest e' un tag <nvr>-microvm dello stesso pacchetto del kernel.
        # Le etichette OCI legano l'immagine al commit e all'NVR; i pin completi vanno
        # nell'attestazione (step successivo).
        env:
          BUILDAH_ISOLATION: chroot
          NVR_EXPECTED: ${{ needs.inputs.outputs.nvr }}
        run: |
          set -euo pipefail
          nvr=$(cat out/nvr)
          [[ $nvr == "$NVR_EXPECTED" ]] || { echo "NVR prodotto ${nvr}, atteso dai pin ${NVR_EXPECTED}"; exit 1; }
          echo "${GH_TOKEN}" | buildah login -u "${GITHUB_ACTOR}" --password-stdin ghcr.io
          mkdir -p digests
          for group in kernel devel debuginfo microvm; do
            case $group in
              kernel) image=$IMAGE tag=$nvr latest=latest ;;
              microvm) image=$IMAGE tag="${nvr}-microvm" latest=latest-microvm ;;
              *) image="${IMAGE}-${group}" tag=$nvr latest=latest ;;
            esac
            ctr=$(buildah from scratch)
            buildah copy "$ctr" "out/${group}/" /
            buildah config \
              --label org.opencontainers.image.title="azoth ${group}" \
              --label org.opencontainers.image.version="${nvr}" \
              --label org.opencontainers.image.revision="${GITHUB_SHA}" \
              --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              "$ctr"
            buildah commit --omit-timestamp "$ctr" "${image}:${tag}"
            buildah push --digestfile "digests/${group}" "${image}:${tag}"
            if [[ $GITHUB_REF == refs/heads/main ]]; then
              buildah push "${image}:${tag}" "docker://${image}:${latest}"
            fi
            echo "${image}@$(cat "digests/${group}")"
            echo "${group}=$(cat "digests/${group}")" >> "$GITHUB_OUTPUT"
          done

      - name: SBOM, sign, attest
        # cosign keyless con l'identita' OIDC del workflow: firma, SBOM SPDX di ogni
        # immagine, e i pin come predicato custom. Le immagini contengono file .rpm, non
        # un rpmdb: il cataloger degli archivi RPM di syft non e' tra quelli di default
        # per le immagini, senza di lui la SBOM elenca zero pacchetti.
        # cosign non legge l'auth.json di buildah: login proprio per caricare firme e
        # attestazioni nel registro.
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | cosign login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          mkdir -p sbom
          python3 forge/specs/azoth/build-inputs.py > pins.json
          for group in kernel devel debuginfo microvm; do
            image=$IMAGE
            [[ $group == kernel || $group == microvm ]] || image="${IMAGE}-${group}"
            ref="${image}@$(cat "digests/${group}")"
            syft scan "registry:${ref}" --select-catalogers "+rpm-archive-cataloger" -o "spdx-json=sbom/${group}.spdx.json"
            jq -e '[.packages[] | select(.name | test("kernel"))] | length > 0' "sbom/${group}.spdx.json" > /dev/null \
              || { echo "SBOM di ${group} senza pacchetti kernel"; exit 1; }
            cosign sign --yes "$ref"
            cosign attest --yes --type spdxjson --predicate "sbom/${group}.spdx.json" "$ref"
            cosign attest --yes --type custom --predicate pins.json "$ref"
          done
        env:
          SYFT_REGISTRY_AUTH_AUTHORITY: ghcr.io
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Provenance SLSA (kernel)
        # Nello store attestazioni di GitHub, non nel registro: `gh attestation verify`
        # legge da li', e senza referrer senza tag la retention resta esatta.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.kernel }}

      - name: Retention (retention.sh)
        # Prima del gate: la verifica prova cio' che resta nel registro. Restano le release
        # (tutte per kernel e devel, due per il debuginfo) e cio' che e' raggiungibile da
        # esse: l'indice dei referrer `sha256-<hex>` e i bundle cosign che elenca.
        run: bash forge/specs/azoth/retention.sh

      - name: Verify (gate K2)
        run: |
          set -euo pipefail
          ref="${IMAGE}@$(cat digests/kernel)"
          cosign verify \
            --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" > /dev/null
          cosign verify-attestation --type spdxjson \
            --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" > /dev/null
          gh attestation verify "oci://${ref}" --repo "${GITHUB_REPOSITORY}"
          echo "verificato: $ref"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-attestations
          path: |
            sbom/
            pins.json
            digests/
          if-no-files-found: error

  nvidia:
    # La catena dei moduli (nvidia-kmod.yml: firma, boot con Secure Boot, pubblicazione)
    # parte da qui, a valle della pubblicazione o del riuso del kernel: workflow_run vale
    # solo dal branch di default, e i moduli servono anche quando publish non gira.
    needs: [inputs, boot, kmod, publish]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.boot.result == 'success' && needs.kmod.result == 'success' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.inputs.outputs.reuse == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: gh workflow run nvidia-kmod.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
