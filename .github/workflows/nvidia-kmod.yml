name: NVIDIA kmod

# I moduli kernel NVIDIA firmati e pubblicati (forge/specs/azoth/nvidia.sh,
# docs/architecture/doc_kernel_build.md, sezione 10). build: nvidia-build.yml, i due
# rami (open 610, legacy 580) contro il kernel-devel pubblicato per l'NVR dei pin.
# sign: su runner GitHub nell'environment `signing`, un job che vede solo i .ko e la
# MOK di progetto. boot: in QEMU con Secure Boot e la MOK di progetto arruolata, il
# nvidia.ko firmato di ogni ramo deve passare la verifica della firma (ENODEV: niente
# GPU) e una copia non firmata deve essere respinta (EKEYREJECTED). publish: OCI
# azoth-nvidia:<nvr>-<ramo> con cosign, SBOM, attestazione dei pin e retention.
# Parte solo per dispatch: da Kernel Build a valle della pubblicazione (o del riuso)
# del kernel, o a mano. Il gate sulle PR e' il job kmod di Kernel Build.

on:
  workflow_dispatch:

concurrency:
  group: nvidia-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KERNEL_IMAGE: ghcr.io/${{ github.repository_owner }}/azoth
  IMAGE: ghcr.io/${{ github.repository_owner }}/azoth-nvidia

jobs:
  build:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/nvidia-build.yml

  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment: signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: nvidia-*-unsigned
          path: out
          merge-multiple: true

      - name: Build the nvidia image
        env:
          BUILDAH_ISOLATION: chroot
        run: podman build -t localhost/azoth-nvidia forge/specs/azoth/nvidia

      - name: Kernel-devel from the published image
        # Solo per scripts/sign-file, che nvidia.sh estrae dal RPM.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          nvr=$(bash forge/specs/azoth/nvr.sh)
          echo "${GH_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          trap 'podman logout ghcr.io' EXIT
          ctr=$(podman create "${KERNEL_IMAGE}-devel:${nvr}" /kernel-devel)
          mkdir -p devel && podman cp "${ctr}:/." devel/ && podman rm "$ctr" > /dev/null

      - name: Sign with the project MOK
        # La chiave vive in un file 0600 nel tmp del runner per la durata del comando,
        # montata in sola lettura nel container; il certificato pubblico e' nel repo.
        env:
          MOK_PRIVATE_KEY: ${{ secrets.MOK_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$MOK_PRIVATE_KEY" > "$RUNNER_TEMP/mok.key"
          trap 'rm -f "$RUNNER_TEMP/mok.key"' EXIT
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/forge" \
            -v "$RUNNER_TEMP/mok.key:/run/mok.key:ro" \
            -w /forge localhost/azoth-nvidia \
            bash forge/specs/azoth/nvidia.sh sign --key /run/mok.key \
              --cert forge/specs/azoth/keys/mok/athanor-mok.pem --devel /forge/devel --out /forge/out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nvidia-signed
          path: out/
          if-no-files-found: error

  boot:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nvidia-signed
          path: signed

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        # Il controllo negativo: lo stesso nvidia.ko prima della firma.
        with:
          name: nvidia-open-unsigned
          path: unsigned

      - name: Kernel-core from the published image
        run: |
          set -euo pipefail
          nvr=$(bash forge/specs/azoth/nvr.sh)
          ctr=$(podman create "${KERNEL_IMAGE}:${nvr}" /kernel-core)
          mkdir -p out && podman cp "${ctr}:/." out/ && podman rm "$ctr" > /dev/null
          echo "nvr=${nvr}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/kvm

      - name: Build the boot-matrix image
        env:
          BUILDAH_ISOLATION: chroot
        run: podman build -t localhost/azoth-boot forge/specs/azoth/boot

      - name: Run boot.sh with the signed modules
        # Solo i casi UEFI: la fiducia nella MOK arriva da MokListRT, che senza shim non
        # esiste. La MOK di progetto entra nel varstore accanto a quella effimera della UKI.
        run: |
          set -euo pipefail
          mkdir -p boot-out
          ko="lib/modules/${nvr}.x86_64/extra/nvidia/nvidia.ko"
          podman run --rm --device /dev/kvm -v "$GITHUB_WORKSPACE:/forge" -w /forge localhost/azoth-boot \
            bash forge/specs/azoth/boot.sh --rpms /forge/out --out /forge/boot-out \
              --case uefi-nehalem --case uefi-host \
              --mok forge/specs/azoth/keys/mok/athanor-mok.pem \
              --insmod "signed/open/${ko}:ENODEV" \
              --insmod "signed/legacy/${ko}:ENODEV" \
              --insmod "unsigned/open/${ko}:EKEYREJECTED"

      - name: Summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -f boot-out/summary.md ]]; then cat boot-out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && hashFiles('boot-out/**') != '' }}
        with:
          name: nvidia-boot-logs
          path: boot-out/
          if-no-files-found: error

  publish:
    needs: [sign, boot]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nvidia-signed
          path: out

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26

      - name: Publish one OCI image per branch
        id: publish
        env:
          BUILDAH_ISOLATION: chroot
        run: |
          set -euo pipefail
          nvr=$(bash forge/specs/azoth/nvr.sh)
          echo "${GH_TOKEN}" | buildah login -u "${GITHUB_ACTOR}" --password-stdin ghcr.io
          mkdir -p digests
          for driver in open legacy; do
            version=$(cat "out/${driver}/version")
            [[ $(cat "out/${driver}/kver") == "${nvr}.x86_64" ]] || { echo "kver dei moduli ${driver} diverso da ${nvr}"; exit 1; }
            ctr=$(buildah from scratch)
            buildah copy "$ctr" "out/${driver}/" /
            buildah config \
              --label org.opencontainers.image.title="azoth-nvidia ${driver}" \
              --label org.opencontainers.image.version="${nvr}-${driver}-${version}" \
              --label org.opencontainers.image.revision="${GITHUB_SHA}" \
              --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              "$ctr"
            buildah commit --omit-timestamp "$ctr" "${IMAGE}:${nvr}-${driver}"
            buildah push --digestfile "digests/${driver}" "${IMAGE}:${nvr}-${driver}"
            echo "${IMAGE}:${nvr}-${driver} @$(cat "digests/${driver}")"
          done
          echo "nvr=${nvr}" >> "$GITHUB_OUTPUT"

      - name: SBOM, sign, attest
        # cosign keyless; la SBOM viene dal cataloger dei moduli kernel di syft; il
        # predicato custom lega l'immagine ai pin NVIDIA e al kernel.
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | cosign login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          mkdir -p sbom
          for driver in open legacy; do
            ref="${IMAGE}@$(cat "digests/${driver}")"
            python3 - "$driver" > "pins-${driver}.json" <<'PY'
          import json, pathlib, re, sys
          k = pathlib.Path("forge/specs/azoth")
          pins = dict(re.findall(r"^(NVIDIA_\w+)=(.*)$", (k / "pins.env").read_text(), re.M))
          driver = sys.argv[1]
          print(json.dumps({"driver": driver, "version": (pathlib.Path("out") / driver / "version").read_text().strip(),
                            "kernel": (pathlib.Path("out") / driver / "kver").read_text().strip(), "pins": pins}, indent=2))
          PY
            syft scan "registry:${ref}" -o "spdx-json=sbom/${driver}.spdx.json"
            jq -e '[.packages[] | select(.name | startswith("nvidia"))] | length > 0' "sbom/${driver}.spdx.json" > /dev/null \
              || { echo "SBOM di ${driver} senza moduli nvidia"; exit 1; }
            cosign sign --yes "$ref"
            cosign attest --yes --type spdxjson --predicate "sbom/${driver}.spdx.json" "$ref"
            cosign attest --yes --type custom --predicate "pins-${driver}.json" "$ref"
          done
        env:
          SYFT_REGISTRY_AUTH_AUTHORITY: ghcr.io
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Retention (retention.sh)
        run: bash forge/specs/azoth/retention.sh

      - name: Verify (gate K4)
        run: |
          set -euo pipefail
          for driver in open legacy; do
            ref="${IMAGE}@$(cat "digests/${driver}")"
            cosign verify \
              --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" > /dev/null
            cosign verify-attestation --type custom \
              --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" > /dev/null
            echo "verificato: $ref"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nvidia-attestations
          path: |
            sbom/
            pins-*.json
            digests/
          if-no-files-found: error
